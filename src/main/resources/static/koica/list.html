<div class="app-nav" data-include="./_include_/nav.html?_="></div>
<div class="container">
	
	<div class="app-query">
		<form class="app-form" name="form">
			<label class="app-form-item">
				검색어
				<input type=text name=keyword />
			</label>
			<label class="app-form-item">
				<button> 검색 </button>
			</label>
		</form>
	</div>
	<div class="app-result">
		<div class="app-result-head">
		</div>
		<table class="app-result-list grid">
			<colgroup>
				<col width="80px" />
				<col />
				<col width="120px"/>
				<col width="160px"/>
			</colgroup>
			<thead>
				<tr>
					<th>NO.</th>
					<th>제목</th>
					<th>작성자</th>
					<th>작성일시</th>
				</tr>
			</thead>
			<tbody>
			</tbody><!--<if test="row.isNew == true"> [new]</if> -->
			<script class="tbody-template" type="text/template" >
			<choose><when test="rows != null">
				<foreach index="idx" collection="rows" item="row">
				<tr>
					<td class="txtc">${idx + 1}</td>
					<td class="txtl">${row.title}<if test="row.isNew == 'Y'"> [new]</if></td>
					<td class="txtc">${row.writer}</td>
					<td class="txtc">${row.wrdttm}</td>
				</tr>
				</foreach>
			</when><otherwise>
				<tr><th colspan="4"> 조회 결과가 없습니다. </th></tr>
			</otherwise></choose>
			</script>
		</table>
		<div class="app-result-foot">
		</div>
	</div>
	
</div>
