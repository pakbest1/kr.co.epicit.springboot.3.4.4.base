<body data-bs-theme="dark">

<script type="text/xml" id="templateA0">
<choose>
  <when test="user.age >= 18">
    Adult: ${user.name}

    Child: #{user.name}

</choose>

</div>

<script>
const template = $('#templateA0').html();
const data = { user: { name: "Alice", age: 17 } };

const result = $.jqMybatis(template, data).trim();
console.log(result); // Adult: Alice
$('.result').html(result);
</script>
