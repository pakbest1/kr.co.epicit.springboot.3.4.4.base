<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>Welcome thymeleaf</title>
</head>

<body>
	<h1>Welcome thymeleaf</h1>
	<h2>name = <span th:text="${name}"></span></h2>
	<h2>list = <span th:text="${list}"></span></h2>

	<div>Thymeleaf List Test</div>

	<tr th:each="index, item: ${list}">
		<span th:text="${index}"></span> 
		<span th:text="${item.index}"></span>
	</tr>
</body>

</html>
